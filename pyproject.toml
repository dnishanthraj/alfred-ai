[project]
name = "wayne-console"
version = "0.8.1"
description = "A local, voice-driven console for talking to a directory of characters"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

# Runtime dependencies are pinned in requirements.txt, which stays the install
# path of record — several of them (mlx-whisper, ctranslate2) are wheel-only
# for specific interpreter versions and are easier to reason about pinned flat.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
wayne = "run:main"

[tool.setuptools.packages.find]
include = ["wayne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # FastAPI's Depends() idiom is a call in a default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
